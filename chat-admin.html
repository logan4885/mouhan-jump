<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>留言板管理</title>
<style>
body{font:15px/1.4 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;margin:0;padding:16px;background:#f6f3ff;color:#2b2540}
h1{font-size:20px;margin:0 0 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input{font:inherit;padding:8px 10px;border:2px solid #2b2540;border-radius:10px}button{font:inherit;font-weight:700;padding:7px 12px;border:2px solid #2b2540;border-radius:10px;background:#fff;cursor:pointer}
button.p{background:#ff6f4e;color:#fff}button.d{background:#ffe0e0}
table{width:100%;border-collapse:collapse;background:#fff;border:2px solid #2b2540;border-radius:12px;overflow:hidden}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}th{background:#2b2540;color:#fff}
tr.hid td{opacity:.45;text-decoration:line-through}tr.hid td.act{text-decoration:none;opacity:1}
.tx{max-width:360px;overflow-wrap:anywhere}.pid{font:12px monospace;color:#777}.rep{color:#d33;font-weight:800}.ban{background:#d33;color:#fff;border-radius:6px;padding:0 5px;font-size:12px}
#msg{margin:8px 0;font-weight:700;color:#d33;min-height:20px}.act button{margin:2px}
</style></head><body>
<h1>💬 留言板管理</h1>
<div class="bar">
  <input id="key" type="password" placeholder="管理口令 (CHAT_ADMIN_KEY)" size="24">
  <input id="api" placeholder="后端地址（自动填，一般不用改）" size="30">
  <button class="p" id="go">查看最近消息</button>
  <label><input type="checkbox" id="auto"> 每 5 秒刷新</label>
</div>
<div id="msg"></div>
<table><thead><tr><th>时间</th><th>玩家</th><th>内容</th><th>举报</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
try { const m = await import('./Leaderboard.js?v=20261112c'); if (m.LEADERBOARD_API.baseUrl) $('api').value = m.LEADERBOARD_API.baseUrl; } catch (e) {}
try { $('key').value = sessionStorage.getItem('chatKey') || ''; $('api').value = $('api').value || localStorage.getItem('chatApi') || ''; } catch (e) {}
async function call(body) {
  const base = $('api').value.trim().replace(/\/+$/, '');
  if (!base) throw new Error('请填写后端地址');
  const r = await fetch(base + '/api/chat/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: $('key').value, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) throw new Error(j.error === 'forbidden' ? '口令不对' : j.error === 'disabled' ? '服务器还没设置 CHAT_ADMIN_KEY' : (j.error || 'HTTP ' + r.status));
  return j;
}
async function load() {
  $('msg').textContent = '';
  try {
    sessionStorage.setItem('chatKey', $('key').value); localStorage.setItem('chatApi', $('api').value);
    const j = await call({ action: 'list' });
    $('rows').innerHTML = j.msgs.map((m) => `<tr class="${m.hidden ? 'hid' : ''}"><td>${new Date(m.ts * 1000).toLocaleString()}</td>
      <td>${esc(m.avatar)} <b>${esc(m.nick)}</b> ${m.banned ? '<span class="ban">已禁言</span>' : ''}<div class="pid">${m.pid}</div></td>
      <td class="tx">${esc(m.text)}</td><td>${m.reports ? `<span class="rep">${m.reports}</span>` : ''}${m.hidden ? '<br>已隐藏' : ''}</td>
      <td class="act">${m.hidden ? `<button data-a="restore" data-m="${m.id}">恢复</button>` : `<button class="d" data-a="delete" data-m="${m.id}">删除</button>`}
        ${m.banned ? `<button data-a="unban" data-p="${m.pid}">解封</button>` : `<button class="d" data-a="ban" data-p="${m.pid}" data-h="24">禁言24小时</button><button class="d" data-a="ban" data-p="${m.pid}" data-h="0">永久禁言</button>`}</td></tr>`).join('');
  } catch (e) { $('msg').textContent = e.message; }
}
$('go').onclick = load;
$('rows').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const body = { action: b.dataset.a, msg: b.dataset.m, pid: b.dataset.p, hours: Number(b.dataset.h || 0), purge: true };
  if (b.dataset.a === 'ban' && !confirm(b.dataset.h === '0' ? '永久禁言这个玩家，并隐藏他的全部消息？' : '禁言这个玩家 24 小时，并隐藏他的全部消息？')) return;
  try { await call(body); load(); } catch (err) { $('msg').textContent = err.message; }
};
let t = null; $('auto').onchange = () => { clearInterval(t); if ($('auto').checked) t = setInterval(load, 5000); };
if ($('key').value && $('api').value) load();
</script></body></html>
