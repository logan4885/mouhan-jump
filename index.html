<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#cfe9ff">
  <title>跳一跳 3D</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js 以 ES Module 方式从 CDN 引入 -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body class="theme-candy">
  <div id="app">
    <canvas id="game" aria-label="游戏画面"></canvas>

    <!-- 实时计分板 -->
    <div id="hud" class="hidden">
      <div class="score" id="score">0</div>
      <div class="best"><span data-i18n="best">最高分</span> <span id="best">0</span></div>
      <div class="combo hidden" id="combo">完美 ×2</div>
      <div class="perk hidden" id="perk"></div>
    </div>

    <!-- 蓄力条 -->
    <div id="charge" class="hidden" aria-hidden="true">
      <div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div>
      <div class="charge-label" data-i18n="charging">蓄力中…</div>
    </div>

    <!-- 得分飘字 -->
    <div id="popups" aria-hidden="true"></div>

    <!-- 开始界面 -->
    <section id="start" class="screen">
      <a class="site-back" href="https://mouhan.dev/" data-i18n="back_site">↩ 牟涵的小屋</a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ar">عربي</button>
      </div>
      <div class="logo">
        <div class="logo-cube"></div>
        <h1><bdi data-i18n="logo">跳一跳</bdi> <span>3D</span></h1>
      </div>
      <p class="subtitle" data-i18n="subtitle">按住蓄力，松开起跳。落在正中心得分翻倍！</p>
      <button class="btn primary big" id="btnStart" data-i18n="start">开始游戏</button>
      <div class="btn-row">
        <button class="btn" id="btnSkinsStart" data-i18n="skins">🎨 皮肤</button>
        <button class="btn" id="btnRankStart" data-i18n="rank">🏆 排行榜</button>
      </div>
      <p class="start-best"><span data-i18n="my_best">我的最高分</span> <b id="startBest">0</b></p>
      <p class="controls">
        <span class="only-desktop" data-i18n="ctl_desktop">电脑：按住鼠标左键或空格键</span>
        <span class="only-touch" data-i18n="ctl_touch">手机：按住屏幕任意位置</span>
      </p>
    </section>

    <!-- 结算弹窗 -->
    <div class="modal-wrap hidden" id="overModal" role="dialog" aria-modal="true" aria-labelledby="overTitle">
      <div class="modal over">
        <h2 id="overTitle" data-i18n="over_title">游戏结束</h2>
        <div class="record hidden" id="overRecord" data-i18n="new_record">🎉 新纪录！</div>
        <div class="over-score" id="overScore">0</div>
        <div class="over-best" id="overLine"></div>
        <div class="unlocked hidden" id="overUnlocked"></div>
        <label class="nick">
          <span data-i18n="nick_label">排行榜昵称</span>
          <input id="nickInput" maxlength="12" placeholder="给自己起个名字" data-i18n-ph="nick_ph" autocomplete="off">
        </label>
        <button class="btn primary big" id="btnRestart" data-i18n="restart">再来一局</button>
        <div class="btn-row">
          <button class="btn" id="btnSkinsOver" data-i18n="skins">🎨 皮肤</button>
          <button class="btn" id="btnRankOver" data-i18n="rank">🏆 排行榜</button>
          <button class="btn" id="btnHome" data-i18n="home">🏠 首页</button>
        </div>
        <a class="site-link" href="https://mouhan.dev/" data-i18n="back_site">↩ 牟涵的小屋</a>
      </div>
    </div>

    <!-- 皮肤商店 -->
    <div class="modal-wrap hidden" id="skinModal" role="dialog" aria-modal="true" aria-labelledby="skinTitle">
      <div class="modal skins">
        <button class="close" data-close aria-label="关闭" data-i18n-aria="close">✕</button>
        <h2 id="skinTitle" data-i18n="shop_title">皮肤商店</h2>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="player" role="tab" data-i18n="tab_player">易拉罐</button>
          <button class="tab" data-tab="block" role="tab" data-i18n="tab_block">方块</button>
        </div>
        <div class="preview-box">
          <canvas id="skinPreview"></canvas>
          <div class="preview-info">
            <b id="skinName"></b>
            <span id="skinDesc"></span>
            <span class="perk-line" id="skinPerk"></span>
          </div>
        </div>
        <div class="skin-grid" id="skinGrid"></div>
        <button class="btn primary big" id="btnUseSkin">使用</button>
        <form class="redeem" id="redeemForm" autocomplete="off">
          <input id="redeemInput" maxlength="24" placeholder="输入兑换码" data-i18n-ph="redeem_ph" spellcheck="false" autocapitalize="characters" dir="ltr">
          <button class="btn" type="submit" data-i18n="redeem_btn">兑换</button>
        </form>
        <p class="redeem-msg" id="redeemMsg" role="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- 排行榜 -->
    <div class="modal-wrap hidden" id="rankModal" role="dialog" aria-modal="true" aria-labelledby="rankTitle">
      <div class="modal rank">
        <button class="close" data-close aria-label="关闭" data-i18n-aria="close">✕</button>
        <h2 id="rankTitle"><span data-i18n="rank_title">排行榜</span> <small>TOP 10</small></h2>
        <ol class="rank-list" id="rankList"><li class="loading" data-i18n="loading">加载中…</li></ol>
        <div class="rank-mine" id="rankMine"></div>
        <p class="rank-note" id="rankNote"></p>
      </div>
    </div>

    <div class="modal-wrap hidden" id="playerModal" role="dialog" aria-modal="true">
      <div class="modal player">
        <button class="close" data-close aria-label="关闭" data-i18n-aria="close">✕</button>
        <div id="playerBody"></div>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="nogl" class="hidden">
      <h2 data-i18n="nogl_t">无法启动 3D 画面</h2>
      <p data-i18n="nogl_p">你的浏览器不支持 WebGL，或 Three.js 加载失败。请更换浏览器或检查网络后刷新。</p>
    </div>
  </div>

  <script type="module" src="main.js"></script>
  <!-- 兜底：Three.js 或模块加载失败时给出提示 -->
  <script>
    setTimeout(function () { if (!window.__jumpReady) document.getElementById('nogl').classList.remove('hidden'); }, 9000);
  </script>
</body>
</html>
